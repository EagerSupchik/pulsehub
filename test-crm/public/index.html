<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CRM</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div class="toolbar">
        <button id="openCreate">Новая задача</button>
      </div>
      <section>
        <div class="section-head">
          <h2>Задачи</h2>
        </div>
        <div id="tasks"></div>
      </section>
      <section>
        <h2>Пользователи</h2>
        <div id="users" class="users"></div>
      </section>
    </main>
    <dialog id="createDialog">
      <form id="createForm" method="dialog">
        <h2>Новая задача</h2>
        <label>Название<input name="title" required /></label
        ><label>Проект<input name="project" value="Основной проект" /></label
        ><label
          >Исполнитель<select name="assigneeId" id="newAssignee"></select
        ></label>
        <div class="grid">
          <label
            >Приоритет<select name="priority">
              <option value="low">Низкий</option>
              <option value="medium" selected>Средний</option>
              <option value="high">Высокий</option>
            </select></label
          ><label
            >Формат задачи<select name="workStyle">
              <option value="">Без персонализации</option>
              <option value="explorer">Новые решения</option>
              <option value="organizer">Структура и точность</option>
              <option value="connector">Коммуникация</option>
              <option value="supporter">Командная поддержка</option>
              <option value="stabilizer">Работа с изменениями</option>
            </select></label
          ><label
            >Очки<input name="points" type="number" min="0" value="100"
          /></label>
        </div>
        <div class="dialog-actions">
          <button type="button" id="closeCreate">Отмена</button
          ><button type="submit">Создать</button>
        </div>
      </form>
    </dialog>
    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
